<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaimMate / ClaimFlow 工作台</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#203d48;background:#f4f7f7}body{max-width:1180px;margin:auto;padding:26px}h1{margin:0;font-size:27px}small,.muted{color:#607980}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}section{background:white;border:1px solid #d8e3e5;border-radius:12px;padding:22px;margin:16px 0}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea,select,button{font:inherit;box-sizing:border-box;border:1px solid #b9cdd1;border-radius:6px;padding:10px}input,textarea,select{width:100%;background:white}button{background:#176866;color:white;cursor:pointer;margin:10px 8px 0 0}button.secondary{background:white;color:#176866}button:disabled{opacity:.5}textarea{resize:vertical;min-height:90px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;line-height:1.7}details pre{font:13px/1.6 Consolas,monospace;background:#f4f7f7;padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.row{display:flex;gap:15px}.row>*{flex:1}.badge{border-radius:30px;padding:8px 14px;background:#e6f1ef;font-size:13px}#status{color:#9a4b26}.flow{font-size:14px;background:#eaf3f2;padding:15px;line-height:2;border-radius:8px}@media(max-width:760px){.grid{grid-template-columns:1fr}body{padding:14px}header{display:block}.row{display:block}}
</style>
<header><div><h1>ClaimMate / ClaimFlow</h1><p class="muted">核保知识检索 · 理赔初审准备</p></div><span class="badge" id="mode">正在读取运行模式</span></header>
<section><label for="token">本机访问令牌</label><input type="password" id="token" autocomplete="off" placeholder="仅用于本机访问，不会写入浏览器存储"><button id="login">连接工作台</button><p id="status" role="status"></p></section>
<div class="grid"><section><h2>条款与规则问答</h2><div class="flow" id="rag-flow">会话记忆 → 意图与改写 → 检索 → 条件证据核对 → 原文 / 生成回答 → 事务保存</div>
<div class="row"><div><label for="product">产品版本</label><select id="product"><option value="">沿用上下文 / 根据问题识别</option></select></div><div><label for="plan">计划</label><select id="plan"><option value="">未指定 / 沿用上下文</option><option>basic</option><option>plus</option></select></div></div>
<label for="asof">业务时点</label><input type="date" id="asof" value="2026-01-01"><label for="question">问题</label><textarea id="question">甲医疗险等待期有什么约定？</textarea>
<button id="ask">检索并回答</button><button class="secondary" id="newchat">新会话</button><small id="chatinfo"></small>
<pre id="answer" aria-live="polite">连接后可继续追问“再列出两个其他产品”“第二个有哪些例外”。</pre><details><summary>检索计划、原文和来源</summary><pre id="raw"></pre></details></section>
<section><h2>理赔初审准备</h2><div class="flow">保单快照 → 材料核查 → 责任依据与规则 → Decimal试算 → 人工复核 / 补件续办</div>
<p class="muted">本机示例使用明确标识的合成保单与人工确认字段。尚未接入OCR、理赔核心或支付。</p><label for="casejson">材料及确认事实（可编辑）</label><textarea id="casejson" style="min-height:260px;font:13px/1.5 Consolas,monospace"></textarea>
<button id="create">新建赔案</button><button id="replace" class="secondary">替换材料并重算</button><button class="secondary" id="missing">填入缺件示例</button><button class="secondary" id="complete">填入完整示例</button>
<pre id="claimanswer" aria-live="polite"></pre><details><summary>工具轨迹、规则和试算明细</summary><pre id="claimraw"></pre></details></section></div>
<script>
const $=id=>document.getElementById(id);let chat=crypto.randomUUID(),rev=0,caseId=null,caseRev=0,catalogProducts=[];
const reqId=()=>crypto.randomUUID();
async function api(path,body,method='POST'){let r=await fetch(path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('token').value},...(body?{body:JSON.stringify(body)}:{})});let data=await r.json();if(!r.ok)throw Error(r.status+' '+JSON.stringify(data.detail));return data}
function info(){$('chatinfo').textContent='会话 '+chat.slice(0,8)+' · 修订 '+rev}info();
async function work(fn){try{$('status').textContent='处理中';await fn();$('status').textContent='请求完成'}catch(e){$('status').textContent=e.message}}
function updatePlans(){const selected=catalogProducts.filter(p=>!$('product').value||p.version_id===$('product').value);const plans=[...new Set(selected.flatMap(p=>p.plan_ids))];$('plan').replaceChildren(new Option('未指定 / 沿用上下文',''),...plans.map(p=>new Option(p,p)))}
$('product').onchange=updatePlans;
$('login').onclick=()=>work(async()=>{let data=await api('/api/enterprise/catalog',null,'GET');catalogProducts=data.products;$('product').replaceChildren(new Option('沿用上下文 / 根据问题识别',''),...data.products.map(p=>new Option(p.title+' · '+p.version_id,p.version_id)));updatePlans();$('create').disabled=!data.claims_enabled;$('replace').disabled=!data.claims_enabled;$('mode').textContent=data.mode});
$('newchat').onclick=()=>{chat=reqId();rev=0;info();$('answer').textContent='已开始新会话';$('raw').textContent=''};
$('ask').onclick=()=>work(async()=>{const body={conversation_id:chat,request_id:reqId(),expected_revision:rev,question:$('question').value};if($('product').value)body.version_ids=[$('product').value];if($('plan').value)body.plan_id=$('plan').value;if($('asof').value)body.as_of=$('asof').value;let data=await api('/api/enterprise/ask',body);rev=data.revision;info();$('answer').textContent=data.status+'\n\n'+data.answer+(data.scope_note?'\n\n'+data.scope_note:'');$('raw').textContent=JSON.stringify(data,null,2);if(['ANSWERED','SOURCE_EVIDENCE'].includes(data.status)){$('product').value='';updatePlans()}});
function sample(full){return {policy_id:'policy-demo',materials:(full?['invoice','discharge','settlement']:['invoice']).map(m=>({material_id:m,kind:m,subject_id:'person-demo',confirmed:true,filename:m+'.txt',text:'合成验证材料 '+m})),confirmed_facts:Object.fromEntries(Object.entries({eligible_expense:'1000.01',other_paid:'100.00',waiting_met:true,hospital_eligible:true}).map(([k,value])=>[k,{value,material_ids:['invoice']}]))}}
function fill(full){$('casejson').value=JSON.stringify(sample(full),null,2)}fill(true);$('missing').onclick=()=>fill(false);$('complete').onclick=()=>fill(true);
function showCase(data){caseRev=data.revision;$('claimanswer').textContent=data.status+'\n缺项：'+(data.missing_info||[]).join('、')+'\n试算：'+(data.calculation?.estimated_amount||'未计算')+'\n此结果需人工复核。';$('claimraw').textContent=JSON.stringify(data,null,2)}
async function runCase(){showCase(await api('/api/enterprise/cases/'+caseId+'/run',{request_id:reqId(),expected_revision:caseRev}))}
$('create').onclick=()=>work(async()=>{let body=JSON.parse($('casejson').value);caseId='case-'+reqId();let data=await api('/api/enterprise/cases',{...body,case_id:caseId,request_id:reqId()});caseRev=data.revision;await runCase()});
$('replace').onclick=()=>work(async()=>{if(!caseId)throw Error('请先新建赔案');let body=JSON.parse($('casejson').value);let data=await api('/api/enterprise/cases/'+caseId+'/materials',{request_id:reqId(),expected_revision:caseRev,materials:body.materials,confirmed_facts:body.confirmed_facts},'PUT');caseRev=data.revision;await runCase()});
fetch('/health').then(r=>r.json()).then(x=>{$('mode').textContent=x.mode+' · '+x.state_backend; $('rag-flow').textContent='会话记忆 → 意图与改写 → '+(x.mode.includes('CONTEXTUAL')?'Contextual dense + BM25':x.mode.includes('WINDOW_FIXED')?'窗口 dense + BM25':'四路检索')+' → 条件证据核对 → 原文 / 生成回答 → 事务保存'}).catch(()=>$('mode').textContent='服务不可用');
</script></html>
